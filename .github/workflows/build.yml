name: Build Window 12
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y debootstrap xorriso syslinux isolinux

      - name: Build 32-bit rootfs
        run: |
          sudo debootstrap --arch=i386 --variant=minbase --exclude=console-setup jammy /tmp/nr http://archive.ubuntu.com/ubuntu
          sudo mount --bind /dev /tmp/nr/dev
          sudo mount --bind /proc /tmp/nr/proc
          sudo mount --bind /sys /tmp/nr/sys
          sudo chroot /tmp/nr /bin/bash -c "sed -i 's/^deb http:\/\/archive.ubuntu.com\/ubuntu jammy main/deb http:\/\/archive.ubuntu.com\/ubuntu jammy main universe multiverse/' /etc/apt/sources.list && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openbox tint2 dillo feh xterm x11-xserver-utils wine32 vlc network-manager wpasupplicant linux-firmware linux-image-generic initramfs-tools && echo window12 > /etc/hostname && printf 'WINDOW 12 v1.0\nMade by ABDUL REHMAN FAROOQI\n' > /etc/issue && apt-get clean && rm -rf /var/lib/apt/lists/*"
          sudo umount /tmp/nr/dev
          sudo umount /tmp/nr/proc
          sudo umount /tmp/nr/sys

      - name: Add Win11 theme + wallpaper + branding
        run: |
          sudo mkdir -p /tmp/nr/root/.config/tint2
          sudo mkdir -p /tmp/nr/root/.config/openbox
          sudo mkdir -p /tmp/nr/root/wallpapers
          sudo cp win11-wallpaper.jpg /tmp/nr/root/wallpapers/
          printf 'rounded=1\nborder_width=0\nbackground_color=#1E1E2E 90\nborder_color=#1E1E2E 0\nrounded=1\nborder_width=0\nbackground_color=#4CC2FF 70\nborder_color=#4CC2FF 0\nrounded=1\nborder_width=0\nbackground_color=#3A3A4E 80\nborder_color=#3A3A4E 0\npanel_items=LTSCB\npanel_size=100%% 36\npanel_margin=0 0\npanel_padding=4 0 4\npanel_background_id=1\nwm_menu=1\npanel_position=bottom center horizontal\npanel_layer=bottom\npanel_monitor=all\npanel_shrink=0\nautohide=0\nstrut_policy=follow_size\npanel_window_name=tint2\ndisable_transparency=0\nmouse_effects=1\ntask_padding=6 4 6\ntask_background_id=0\ntask_active_background_id=2\ntask_iconified_background_id=3\ntask_centered=1\ntask_text=0\ntask_icon=1\ntask_icon_size=24\nsystray_padding=4 4 4\nsystray_background_id=0\nsystray_icon_size=18\nclock_font_color=#FFFFFF\nclock_padding=6 0\nclock_background_id=0\nclock_format=%%H:%%M\nclock_tooltip=%%A %%d %%B %%Y\nlauncher_padding=4 4 4\nlauncher_background_id=0\nlauncher_icon_size=28\n' | sudo tee /tmp/nr/root/.config/tint2/tint2rc > /dev/null
          printf '#!/bin/sh\nnm-applet &\nfeh --bg-fill /root/wallpapers/win11-wallpaper.jpg &\n(sleep 1 && tint2) &\nexec openbox-session\n' | sudo tee /tmp/nr/root/.config/openbox/autostart > /dev/null
          sudo chmod +x /tmp/nr/root/.config/openbox/autostart
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<openbox_menu>\n  <menu id="root-menu" label="Window 12">\n    <menu label="Applications">\n      <item label="Terminal">\n        <action name="Execute"><command>xterm</command></action>\n      </item>\n      <item label="Browser">\n        <action name="Execute"><command>dillo</command></action>\n      </item>\n      <item label="VLC">\n        <action name="Execute"><command>vlc</command></action>\n      </item>\n      <item label="Wine (EXE Apps)">\n        <action name="Execute"><command>xterm -e wine explorer</command></action>\n      </item>\n      <item label="CMD (Wine)">\n        <action name="Execute"><command>xterm -e wine cmd</command></action>\n      </item>\n    </menu>\n    <separator/>\n    <menu label="System">\n      <item label="Settings">\n        <action name="Execute"><command>xterm -e echo "Window 12 Settings\\nRAM: 400MB max\\n32-bit\\nMade by ABDUL REHMAN FAROOQI"</command></action>\n      </item>\n      <item label="Reboot">\n        <action name="Execute"><command>reboot</command></action>\n      </item>\n      <item label="Shutdown">\n        <action name="Execute"><command>poweroff</command></action>\n      </item>\n    </menu>\n  </menu>\n</openbox_menu>\n' | sudo tee /tmp/nr/root/.config/openbox/menu.xml > /dev/null

      - name: Prepare boot
        run: |
          sudo mkdir -p /tmp/nr/isolinux
          sudo cp /tmp/nr/boot/vmlinuz-* /tmp/nr/vmlinuz
          sudo cp /tmp/nr/boot/initrd.img-* /tmp/nr/initrd.img
          sudo cp /usr/lib/ISOLINUX/isolinux.bin /tmp/nr/isolinux/
          sudo cp /usr/lib/syslinux/modules/bios/menu.c32 /tmp/nr/isolinux/
          sudo cp /usr/lib/syslinux/modules/bios/ldlinux.c32 /tmp/nr/isolinux/
          sudo cp oppo-logo.bmp /tmp/nr/isolinux/boot.splash
          printf 'UI menu.c32\nDEFAULT linux\nPROMPT 0\nTIMEOUT 300\nMENU TITLE Window 12 - Made by ABDUL REHMAN FAROOQI\nLABEL linux\n  MENU LABEL Window 12\n  KERNEL /vmlinuz\n  INITRD /initrd.img\n  APPEND initrd=/initrd.img root=/dev/sda auto acpi_osi=\\! acpi_osi=Windows 2012 i915.modeset=1 i915.enable_fbc=0 i915.enable_psr=0 intel_idle.max_cstate=1\n' | sudo tee /tmp/nr/isolinux/isolinux.cfg > /dev/null

      - name: Make ISO
        run: |
          sudo xorriso -as mkisofs -o /tmp/window12.iso -R -J -V "WINDOW12" -b isolinux/isolinux.bin -c isolinux/boot.cat -no-emul-boot -boot-load-size 4 -boot-info-table /tmp/nr/
          ls -la /tmp/window12.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: window12
          path: /tmp/window12.iso   
